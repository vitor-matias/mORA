<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- viewport-fit=cover: the page draws under the system bars instead of
       being inset below them. Android 15 stopped honouring an app's status bar
       colour and shows whatever is drawn behind the bar, which for an installed
       PWA was the manifest colour baked in at install — light, whatever the
       theme. Owning that strip means the html background paints it in the
       active theme. Every top-anchored element pads by
       env(safe-area-inset-top) to stay clear of the clock; where the platform
       does not draw edge-to-edge the inset is 0 and nothing changes. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- One theme-color, set by the script below before first paint and kept
       in step by Layout afterwards. Not a pair scoped by media="(prefers-color-
       scheme)": a browser tab honours that attribute, but an installed app on
       Android and iOS reads the first theme-color it finds — which made the
       system bar the light colour whatever the theme, on both platforms. -->
  <meta name="theme-color" content="#FAF9F6" />
  <title>mORA</title>
  <script>
    // Apply theme before first paint so there is no flash of the wrong
    // theme (the React effect in Layout keeps it in sync afterwards).
    (function () {
      try {
        var raw = localStorage.getItem('mora-app-storage');
        var state = raw ? (JSON.parse(raw).state || {}) : {};
        var theme = state.theme || 'system';
        var dark = theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        // Before the stylesheet lands this is what keeps the system bars and
        // the page canvas dark on the first frame.
        root.style.colorScheme = dark ? 'dark' : 'light';
        root.style.background = dark ? '#121212' : '#FAF9F6';
        if (state.liturgicalColor) root.setAttribute('data-theme', state.liturgicalColor);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#121212' : '#FAF9F6');
      } catch (e) { /* first visit or blocked storage — defaults apply */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
