<!doctype html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- viewport-fit=cover: the page draws under the system bars instead of
       being inset below them, and pads by env(safe-area-inset-*) to stay clear
       of the clock, the gesture pill and any display cutout. Chrome on Android
       is wiring the same for installed web apps (WebAppShortEdgesCutoutMode) —
       until it ships, the insets there are 0 and nothing changes. See the note
       above the theme-color effect in Layout for why the status bar cannot be
       coloured from the page alone on Android 15+.

       iOS needs the second opt-in below as well. Without it an installed app
       is inset under the status bar, and iOS paints that strip itself from a
       sample of the page taken at launch — and never again: browsing to
       another day repainted the whole page and left the strip on the colour
       the app had opened with, whatever theme-color said (iOS 26, in the
       Simulator and on a phone). black-translucent hands the strip to the
       page: it is the same wash as the rest of the screen, so it follows the
       day by construction, env(safe-area-inset-top) becomes real and the
       top padding everywhere finally does its job. The classic cost of this
       value — white clock and icons whatever the page — is gone: iOS 26
       picks the status bar's text colour from what is under it, black on the
       light page and white on the dark one.

       maximum-scale/user-scalable stop pinch zoom where they are honoured;
       iOS Safari ignores them, so index.css also sets touch-action on html.
       Text size is the app's own setting (Perfil), not the page zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#F7F7F9" />
  <title>Oremus</title>
  <script>
    // Apply theme before first paint so there is no flash of the wrong
    // theme (the React effect in Layout keeps it in sync afterwards).
    (function () {
      try {
        var raw = localStorage.getItem('mora-app-storage');
        var state = raw ? (JSON.parse(raw).state || {}) : {};
        var theme = state.theme || 'system';
        var dark = theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        if (state.liturgicalColor) root.setAttribute('data-theme', state.liturgicalColor);
        // Interface text size, so the page doesn't reflow once React mounts.
        // Same percentages as CONTENT_FONT_SCALE in src/store/app.ts.
        var interfacePercent = { large: '112.5%', xlarge: '125%' }[state.fontSize];
        if (interfacePercent) root.style.fontSize = interfacePercent;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0B0B0C' : '#F7F7F9');
      } catch (e) { /* first visit or blocked storage — defaults apply */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
