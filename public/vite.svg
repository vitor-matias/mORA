<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background flat rounded rect -->
  <rect width="512" height="512" rx="112" fill="#141416" />
  
  <!-- Symmetrical detailed praying hands paths (solid rose gold, no gradients, no glows) -->
  <g fill="none" stroke="#b37979" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer hand contours -->
    <!-- Left Hand -->
    <path d="M 210,400 C 180,400 160,370 170,335 C 180,285 210,210 235,145 C 242,125 248,110 256,105" />
    <!-- Right Hand -->
    <path d="M 302,400 C 332,400 352,370 342,335 C 332,285 302,210 277,145 C 270,125 264,110 256,105" />
    
    <!-- Finger divisions and realistic anatomy lines -->
    <!-- Fingertips meeting -->
    <path d="M 256,105 L 256,112" />
    
    <!-- Thumb contour -->
    <path d="M 228,290 C 235,275 245,245 256,238 C 267,245 277,275 284,290" />
    
    <!-- Index Finger Inner Line -->
    <path d="M 226,200 C 234,175 246,135 256,120 C 266,135 278,175 286,200" />
    
    <!-- Middle Finger Inner Line -->
    <path d="M 220,235 C 230,205 244,165 256,150 C 268,165 282,205 292,235" />
    
    <!-- Ring Finger Inner Line -->
    <path d="M 216,270 C 226,240 242,195 256,180 C 270,195 286,240 296,270" />
    
    <!-- Realistic wrinkle details on knuckles -->
    <!-- Left Hand Knuckle wrinkles -->
    <path d="M 212,235 L 217,238" stroke-width="6" />
    <path d="M 218,200 L 223,203" stroke-width="6" />
    <path d="M 224,165 L 229,168" stroke-width="6" />
    <!-- Right Hand Knuckle wrinkles -->
    <path d="M 300,235 L 295,238" stroke-width="6" />
    <path d="M 294,200 L 289,203" stroke-width="6" />
    <path d="M 288,165 L 283,168" stroke-width="6" />

    <!-- Palm and wrist bones curves -->
    <path d="M 230,340 C 238,320 248,300 256,295 C 264,300 274,320 282,340" stroke-width="8" />

    <!-- Classical detailed fabric folds / cuffs at the bottom -->
    <!-- Left Cuff Folds -->
    <path d="M 210,400 C 180,410 160,370 190,360 C 215,350 230,390 210,400 Z" stroke-width="8" />
    <path d="M 185,385 C 165,395 150,365 175,355" stroke-width="6" />
    <path d="M 195,410 C 185,420 170,390 190,380" stroke-width="6" />

    <!-- Right Cuff Folds -->
    <path d="M 302,400 C 332,410 352,370 322,360 C 297,350 282,390 302,400 Z" stroke-width="8" />
    <path d="M 327,385 C 347,395 362,365 337,355" stroke-width="6" />
    <path d="M 317,410 C 327,420 342,390 322,380" stroke-width="6" />
  </g>
</svg>