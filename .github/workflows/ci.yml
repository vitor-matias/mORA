name: CI

# Runs on pull requests, which nothing did before: the deploy workflow only
# fires on a push to main, so tests ran *after* merge — a failure blocked the
# deploy rather than the merge, which is the wrong way round.
on:
  pull_request:
  push:
    branches: ["main", "master"]

# Read-only: CI builds and tests, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      # The tests import the publishers' code. Without their own node_modules
      # those imports fall through to the root's, whose versions differ, so a
      # bump to a publisher's dependencies would never be exercised.
      - name: Install publishers
        run: |
          npm ci --prefix server/agenda
          npm ci --prefix server/palavra
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  publisher:
    name: Verse pool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: server/palavra/package-lock.json
      - name: Install
        working-directory: server/palavra
        run: npm ci
      # Structure, lengths, duplicate refs, the answer cap, and that no answer
      # is left visible in its own verse. The verbatim-against-corpus check is
      # explicitly opted out of — the texts are not in this repo — so it stays
      # a local step. The flag is required: verify now fails rather than
      # quietly reporting "all clean" for a run that skipped its main check.
      - name: Verify
        working-directory: server/palavra
        run: node verify.js --allow-missing-corpus
