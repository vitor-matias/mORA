version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /server/agenda
      - /server/palavra
    schedule:
      interval: weekly
    groups:
      # react-dom refuses to run against any other version of react.
      react:
        patterns:
          - react
          - react-dom

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
